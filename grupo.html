<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Galicia & Quedadas</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --active-green: #22c55e;
      --text-inactive: #94a3b8;
      --text-active: #090d16;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    /* Barra de pestañas */
    .tabs-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      width: 100%;
    }

    /* Botones de pestaña */
    .tab-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 18px;
      background: transparent;
      border: none;
      outline: none;
      border-radius: 14px;
      color: var(--text-inactive);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease-in-out;
      text-align: center;
      line-height: 1.25;
      user-select: none;
    }

    /* Icono en estado inactivo */
    .tab-btn .tab-icon {
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-inactive);
      fill: currentColor;
      transition: color 0.25s ease, fill 0.25s ease;
      flex-shrink: 0;
    }

    /* Estado activo */
    .tab-btn.active {
      background-color: var(--active-green);
      color: var(--text-active);
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.25);
    }

    /* Icono en estado activo: forzar negro pleno */
    .tab-btn.active .tab-icon {
      color: var(--text-active) !important;
      fill: var(--text-active) !important;
      opacity: 1 !important;
    }

    /* Paneles de contenido */
    .tab-panel {
      display: none;
      padding: 24px 8px;
      animation: fadeIn 0.2s ease-in-out;
    }

    .tab-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Selector de pestañas -->
    <nav class="tabs-nav" role="tablist">
      <!-- Pestaña 1: Agenda Galicia -->
      <button 
        type="button" 
        class="tab-btn active" 
        role="tab" 
        id="tab-agenda" 
        aria-selected="true" 
        aria-controls="panel-agenda"
        onclick="switchTab('agenda')">
        <svg class="tab-icon" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14.5c0 .28-.22.5-.5.5h-5c-.28 0-.5-.22-.5-.5 0-1.66 1.34-3 3-3s3 1.34 3 3zm-4.5-5.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm7 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/>
        </svg>
        <span>Agenda Galicia<br>2026–2027</span>
      </button>

      <!-- Pestaña 2: Quedadas del Grupo -->
      <button 
        type="button" 
        class="tab-btn" 
        role="tab" 
        id="tab-quedadas" 
        aria-selected="false" 
        aria-controls="panel-quedadas"
        onclick="switchTab('quedadas')">
        <svg class="tab-icon" viewBox="0 0 24 24">
          <path d="M16 12V4H17V2H7V4H8V12L6 14V16H11V22H13V16H18V14L16 12Z"/>
        </svg>
        <span>Quedadas del<br>Grupo</span>
      </button>
    </nav>

    <!-- Contenido pestaña Agenda -->
    <section id="panel-agenda" class="tab-panel active" role="tabpanel" aria-labelledby="tab-agenda">
      <!-- Tu contenido o lista de eventos de la agenda aquí -->
    </section>

    <!-- Contenido pestaña Quedadas -->
    <section id="panel-quedadas" class="tab-panel" role="tabpanel" aria-labelledby="tab-quedadas">
      <!-- Tu contenido o lista de quedadas aquí -->
    </section>
  </div>

  <script>
    function switchTab(target) {
      // 1. Alternar estado activo en los botones
      const isAgenda = target === 'agenda';
      const btnAgenda = document.getElementById('tab-agenda');
      const btnQuedadas = document.getElementById('tab-quedadas');
      const panelAgenda = document.getElementById('panel-agenda');
      const panelQuedadas = document.getElementById('panel-quedadas');

      btnAgenda.classList.toggle('active', isAgenda);
      btnAgenda.setAttribute('aria-selected', isAgenda);

      btnQuedadas.classList.toggle('active', !isAgenda);
      btnQuedadas.setAttribute('aria-selected', !isAgenda);

      // 2. Alternar visibilidad de paneles
      panelAgenda.classList.toggle('active', isAgenda);
      panelQuedadas.classList.toggle('active', !isAgenda);
    }
  </script>
</body>
</html>
